namename: Build APK (Ultimate Debug)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Manual Android SDK
        run: |
          SDK_DIR=$HOME/android-sdk
          CMDTOOLS=$SDK_DIR/cmdline-tools/latest
          mkdir -p $CMDTOOLS
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools/* $CMDTOOLS/
          yes | $CMDTOOLS/bin/sdkmanager --licenses > /dev/null || true
          $CMDTOOLS/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
      
      - name: Setup Gradle 8.7
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.7'
          cache-disabled: true
      
      - name: 1. 打印真实目录结构 (关键排查)
        run: |
          echo "=== 当前路径: $(pwd) ==="
          echo "=== 根目录文件 ==="
          ls -la
          echo "=== 是否有 app 目录 ==="
          ls -la app/ 2>/dev/null || echo "没有 app 目录"
          echo "=== 查找所有 gradle 文件 ==="
          find . -maxdepth 2 -name "*.gradle*" -type f -print
      
      - name: 2. 强制修复 Gradle 配置
        run: |
          # 如果原仓库没有 settings.gradle，强制创建一个（假设根目录就是项目，或包含 app）
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "原仓库无 settings.gradle，正在创建..."
            if [ -d "app" ]; then
              echo "include ':app'" > settings.gradle
            else
              echo "根项目即主项目"
            fi
          fi
          echo "=== 最终 settings.gradle 内容 ==="
          cat settings.gradle 2>/dev/null || true
          echo "=== 最终 build.gradle 存在情况 ==="
          ls -la build.gradle* 2>/dev/null || true
      
      - name: 3. 构建 Debug APK (最基础尝试)
        run: |
          echo "=== 尝试直接构建 ==="
          # 不再先跑 tasks，直接尝试构建
          gradle assembleDebug --no-daemon 2>/dev/null || \
          gradle :app:assembleDebug --no-daemon 2>/dev/null || \
          gradle assemble --no-daemon 2>/dev/null || \
          gradle build --no-daemon
      
      - name: 4. 查找 APK
        run: |
          echo "=== 查找所有 .apk 文件 ==="
          find . -name "*.apk" -type f -print
      
      - name: 5. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-overlay-debug
          path: |
            **/*.apk
            app/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
          retention-days: 7

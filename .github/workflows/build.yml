name: Build APK (Ultimate Dynamic)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Manual Android SDK
        run: |
          SDK_DIR=$HOME/android-sdk
          CMDTOOLS=$SDK_DIR/cmdline-tools/latest
          mkdir -p $CMDTOOLS
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools/* $CMDTOOLS/
          yes | $CMDTOOLS/bin/sdkmanager --licenses > /dev/null || true
          $CMDTOOLS/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.7'
      
      - name: Build Debug APK (Dynamic Task)
        run: |
          echo "当前目录: $(pwd)"
          ls -la
          
          # 1. 修正 settings.gradle（确保指向真实的 'app' 目录，清除之前的 '应用' 误导）
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'DeltaOverlay'" >> settings.gradle
          cat settings.gradle
          
          # 2. 动态探测任务
          echo "--- 探测可用任务 ---"
          gradle tasks --all --no-daemon | grep -E "(assemble|build)" || true
          
          # 3. 智能构建逻辑
          if gradle tasks --all --no-daemon | grep -q ":app:assembleDebug"; then
            echo "✅ 检测到 :app:assembleDebug，执行标准 APK 构建..."
            gradle :app:assembleDebug --no-daemon
          elif gradle tasks --all --no-daemon | grep -q "assembleDebug"; then
            echo "✅ 检测到根目录 assembleDebug，执行构建..."
            gradle assembleDebug --no-daemon
          else
            echo "⚠️ 未检测到 assembleDebug（可能不是标准 Android App 模块），执行通用构建..."
            gradle build --no-daemon || gradle assemble --no-daemon || true
          fi
          
          # 4. 打印产出物路径（调试用）
          echo "--- 查找 APK 产出物 ---"
          find . -name "*.apk" -type f -print || true
      
      - name: Upload APK
        if: success() || failure() # 即使构建失败也尝试上传（方便排查）
        uses: actions/upload-artifact@v4
        with:
          name: delta-overlay-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/debug/*.apk
            **/build/libs/*.jar
          retention-days: 7

name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Manual Android SDK
        run: |
          SDK_DIR=$HOME/android-sdk
          CMDTOOLS=$SDK_DIR/cmdline-tools/latest
          mkdir -p $CMDTOOLS
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools/* $CMDTOOLS/
          yes | $CMDTOOLS/bin/sdkmanager --licenses > /dev/null || true
          $CMDTOOLS/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.7'
      
      - name: Build Debug APK
        run: |
          echo "当前目录: $(pwd)"
          ls -la
          # 直接在根目录编译，不cd。使用通配符构建所有模块，或指定 :应用:assembleDebug
          gradle :应用:assembleDebug --no-daemon || gradle assembleDebug --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-overlay-debug
          # 兼容中文目录名“应用”和英文“app”
          path: |
            应用/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
